spring.application.name=nexora-api

# The default profile runs the in-memory demo APIs without requiring a database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.data.jpa.repositories.enabled=false

# Local-only JWT defaults. Override the secret in every shared or production environment.
nexora.auth.jwt-secret=${NEXORA_JWT_SECRET:nexora-local-development-only-secret-change-before-deployment}
nexora.auth.jwt-expiration-minutes=${NEXORA_JWT_EXPIRATION_MINUTES:60}

# Public CheapShark integration. Live results are mapped and cached in memory, with local fallback.
nexora.external-deals.enabled=true
nexora.external-deals.cheapshark.base-url=https://www.cheapshark.com/api/1.0
nexora.external-deals.timeout-seconds=5
nexora.external-deals.default-page-size=12
nexora.external-deals.max-page-size=24

# In-memory provider cache. TTL values are seconds and are clamped to at least one second.
nexora.external-deals.cache.enabled=true
nexora.external-deals.cache.deals-ttl-seconds=300
nexora.external-deals.cache.stores-ttl-seconds=21600

# Database-backed wishlist price refresh is opt-in. Stored is the no-network default provider.
nexora.wishlist.price-refresh.enabled=false
nexora.wishlist.price-refresh.fixed-delay-ms=3600000
nexora.wishlist.price-refresh.provider=stored
nexora.wishlist.price-refresh.cheapshark.enabled=false
nexora.wishlist.price-refresh.cheapshark.page-size=8
nexora.wishlist.price-refresh.cheapshark.match-store=true

# Notification delivery foundation. Disabled by default; log provider sends nothing externally.
nexora.notifications.enabled=false
nexora.notifications.provider=log
