spring.application.name=nexora-api

# The default profile runs the in-memory demo APIs without requiring a database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.data.jpa.repositories.enabled=false

# Local-only JWT defaults. Override the secret in every shared or production environment.
nexora.auth.jwt-secret=${NEXORA_JWT_SECRET:nexora-local-development-only-secret-change-before-deployment}
nexora.auth.jwt-expiration-minutes=${NEXORA_JWT_EXPIRATION_MINUTES:60}

# Local-only refresh-session defaults. Override the hash secret in every shared or production environment.
nexora.auth.refresh-token-hash-secret=${NEXORA_REFRESH_TOKEN_HASH_SECRET:nexora-local-refresh-token-hash-secret-change-before-deployment}
nexora.auth.refresh-token-cookie-name=${NEXORA_REFRESH_TOKEN_COOKIE_NAME:nexora_refresh_token}
nexora.auth.refresh-token-expiration-days=${NEXORA_REFRESH_TOKEN_EXPIRATION_DAYS:7}
nexora.auth.refresh-token-cookie-secure=${NEXORA_REFRESH_TOKEN_COOKIE_SECURE:false}
nexora.auth.refresh-token-cookie-same-site=${NEXORA_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
nexora.auth.refresh-token-cookie-path=${NEXORA_REFRESH_TOKEN_COOKIE_PATH:/api/auth}

# Local browser CSRF and origin checks for cookie-sensitive auth routes.
nexora.auth.csrf.enabled=${NEXORA_AUTH_CSRF_ENABLED:true}
nexora.auth.csrf.cookie-name=${NEXORA_AUTH_CSRF_COOKIE_NAME:nexora_csrf_token}
nexora.auth.csrf.header-name=${NEXORA_AUTH_CSRF_HEADER_NAME:X-NEXORA-CSRF}
nexora.auth.csrf.cookie-secure=${NEXORA_AUTH_CSRF_COOKIE_SECURE:false}
nexora.auth.csrf.cookie-same-site=${NEXORA_AUTH_CSRF_COOKIE_SAME_SITE:Lax}
nexora.auth.csrf.cookie-path=${NEXORA_AUTH_CSRF_COOKIE_PATH:/api/auth}
nexora.auth.csrf.expiration-minutes=${NEXORA_AUTH_CSRF_EXPIRATION_MINUTES:120}
nexora.auth.trusted-origins=${NEXORA_AUTH_TRUSTED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Local process-only auth abuse controls. Counters reset on restart and are not distributed protection.
nexora.auth.abuse-controls.enabled=${NEXORA_AUTH_ABUSE_CONTROLS_ENABLED:true}
nexora.auth.abuse-controls.window-seconds=${NEXORA_AUTH_ABUSE_WINDOW_SECONDS:60}
nexora.auth.abuse-controls.register-max-attempts=${NEXORA_AUTH_ABUSE_REGISTER_MAX_ATTEMPTS:10}
nexora.auth.abuse-controls.login-max-attempts=${NEXORA_AUTH_ABUSE_LOGIN_MAX_ATTEMPTS:20}
nexora.auth.abuse-controls.refresh-max-attempts=${NEXORA_AUTH_ABUSE_REFRESH_MAX_ATTEMPTS:30}
nexora.auth.abuse-controls.logout-max-attempts=${NEXORA_AUTH_ABUSE_LOGOUT_MAX_ATTEMPTS:30}
nexora.auth.abuse-controls.rejection-max-attempts=${NEXORA_AUTH_ABUSE_REJECTION_MAX_ATTEMPTS:30}

# Public CheapShark integration. Live results are mapped and cached in memory, with local fallback.
nexora.external-deals.enabled=true
nexora.external-deals.cheapshark.base-url=https://www.cheapshark.com/api/1.0
nexora.external-deals.timeout-seconds=5
nexora.external-deals.default-page-size=12
nexora.external-deals.max-page-size=24

# In-memory provider cache. TTL values are seconds and are clamped to at least one second.
nexora.external-deals.cache.enabled=true
nexora.external-deals.cache.deals-ttl-seconds=300
nexora.external-deals.cache.stores-ttl-seconds=21600

# Database-backed wishlist price refresh is opt-in. Stored is the no-network default provider.
nexora.wishlist.price-refresh.enabled=false
nexora.wishlist.price-refresh.fixed-delay-ms=3600000
nexora.wishlist.price-refresh.provider=stored
nexora.wishlist.price-refresh.cheapshark.enabled=false
nexora.wishlist.price-refresh.cheapshark.page-size=8
nexora.wishlist.price-refresh.cheapshark.match-store=true

# Notification delivery foundation. Disabled by default; log provider sends nothing externally.
nexora.notifications.enabled=false
nexora.notifications.provider=log

# Email notification provider foundation. No SMTP credentials are configured by default.
nexora.notifications.email.from=no-reply@nexora.local
nexora.notifications.email.subject-prefix=[NEXORA Alert]
nexora.notifications.email.fail-on-missing-recipient=false

# Sentinel AI provider foundation. Local is the safe default; Gemini is backend-only and opt-in.
nexora.sentinel.ai.provider=${NEXORA_SENTINEL_AI_PROVIDER:local}
nexora.sentinel.ai.gemini.api-key=${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
nexora.sentinel.ai.gemini.model=${NEXORA_GEMINI_MODEL:gemini-3.6-flash}
nexora.sentinel.ai.gemini.base-url=${NEXORA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
nexora.sentinel.ai.gemini.timeout-ms=${NEXORA_GEMINI_TIMEOUT_MS:8000}
nexora.sentinel.ai.gemini.max-output-tokens=${NEXORA_GEMINI_MAX_OUTPUT_TOKENS:512}
nexora.sentinel.ai.gemini.temperature=${NEXORA_GEMINI_TEMPERATURE:0.2}

# Sentinel process-local safety controls. These reset with the backend and are not distributed guarantees.
nexora.sentinel.ai.safety.rate-limit-enabled=${NEXORA_SENTINEL_RATE_LIMIT_ENABLED:true}
nexora.sentinel.ai.safety.rate-limit-window-seconds=${NEXORA_SENTINEL_RATE_LIMIT_WINDOW_SECONDS:60}
nexora.sentinel.ai.safety.rate-limit-max-requests=${NEXORA_SENTINEL_RATE_LIMIT_MAX_REQUESTS:12}
nexora.sentinel.ai.safety.max-context-prompt-characters=${NEXORA_SENTINEL_MAX_CONTEXT_PROMPT_CHARACTERS:3500}
nexora.sentinel.ai.safety.max-answer-characters=${NEXORA_SENTINEL_MAX_ANSWER_CHARACTERS:4000}
