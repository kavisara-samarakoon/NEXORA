# Hosted portfolio/demo profile. Every value without a fallback must be supplied
# by the hosting environment; no secret or local database default is accepted.
server.port=${PORT}

spring.datasource.url=${NEXORA_DB_URL}
spring.datasource.username=${NEXORA_DB_USERNAME}
spring.datasource.password=${NEXORA_DB_PASSWORD}

nexora.auth.jwt-secret=${NEXORA_JWT_SECRET}
nexora.auth.refresh-token-hash-secret=${NEXORA_REFRESH_TOKEN_HASH_SECRET}
nexora.auth.trusted-origins=${NEXORA_AUTH_TRUSTED_ORIGINS}

# HTTPS browser baseline. Lax is the default hosted-demo topology; an intentional
# cross-site frontend may override both SameSite values with None while retaining
# the Secure flags and exact-origin CORS validation.
nexora.auth.refresh-token-cookie-secure=true
nexora.auth.refresh-token-cookie-same-site=${NEXORA_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
nexora.auth.refresh-token-cookie-path=/api/auth
nexora.auth.csrf.enabled=true
nexora.auth.csrf.cookie-secure=true
nexora.auth.csrf.cookie-same-site=${NEXORA_AUTH_CSRF_COOKIE_SAME_SITE:Lax}
nexora.auth.csrf.cookie-path=/api/auth
