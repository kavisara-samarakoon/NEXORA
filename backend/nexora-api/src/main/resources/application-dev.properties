# Enable datasource auto-configuration only when the dev profile is active.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.data.jpa.repositories.enabled=true

spring.datasource.url=${NEXORA_DB_URL:jdbc:postgresql://localhost:5432/nexora_db}
spring.datasource.username=${NEXORA_DB_USERNAME:nexora_user}
spring.datasource.password=${NEXORA_DB_PASSWORD:nexora_password}

# Validate mapped entities against the schema without creating or changing it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
