name: Reviewer Tooling CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-preflight:
    name: Reviewer local preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/nexora-web-next/package-lock.json

      - name: Verify preflight script syntax and executable bit
        run: |
          bash -n scripts/reviewer-local-preflight.sh
          test -x scripts/reviewer-local-preflight.sh

      - name: Run reviewer preflight from repository root
        run: scripts/reviewer-local-preflight.sh

      - name: Run reviewer preflight from another directory
        run: |
          (
            cd /tmp
            "${GITHUB_WORKSPACE}/scripts/reviewer-local-preflight.sh"
          )
