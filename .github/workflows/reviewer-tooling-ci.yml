name: Reviewer Tooling CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-preflight:
    name: Reviewer local preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/nexora-web-next/package-lock.json

      - name: Verify preflight script syntax and executable bit
        run: |
          bash -n scripts/reviewer-local-preflight.sh
          test -x scripts/reviewer-local-preflight.sh

      - name: Run reviewer preflight from repository root
        run: scripts/reviewer-local-preflight.sh

      - name: Run reviewer preflight from another directory
        run: |
          (
            cd /tmp
            "${GITHUB_WORKSPACE}/scripts/reviewer-local-preflight.sh"
          )
