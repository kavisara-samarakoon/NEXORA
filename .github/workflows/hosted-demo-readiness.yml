name: Hosted Demo Readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-time checks only; hosted smoke tests and PostgreSQL validation stay opt-in.
jobs:
  deployment-tooling:
    name: Offline deployment tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check deployment script syntax and executable bits
        run: |
          python3 -m py_compile scripts/deployment/check-hosted-demo.py
          bash -n scripts/deployment/validate-hosted-postgres.sh
          bash -n scripts/api-smoke-test.sh
          test -x scripts/deployment/validate-hosted-postgres.sh
          test -x scripts/api-smoke-test.sh

      - name: Run offline deployment checker tests
        run: python3 -m unittest discover -s scripts/deployment/tests -p "*test*.py" -v

  backend-image:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image without starting it
        run: docker build --file backend/nexora-api/Dockerfile --tag nexora-api:ci backend/nexora-api

  frontend-build:
    name: Frontend hosted configuration build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/nexora-web-next

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/nexora-web-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend with placeholder origins
        # Reserved example domains validate configuration shape, not hosted connectivity.
        env:
          NEXT_PUBLIC_API_BASE_URL: /
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXORA_API_BASE_URL: https://api.example.com
        run: npm run build
