name: Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '33 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-npm-audit:
    name: Frontend production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/nexora-web-next

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Audit production dependencies at high severity
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-production.json

      - name: Record full dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=none --json > npm-audit-full.json

      - name: Upload npm audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-npm-audit
          path: frontend/nexora-web-next/npm-audit-*.json
          if-no-files-found: error
          retention-days: 14

  backend-runtime-vulnerability-scan:
    name: Backend runtime dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test gate behavior
        run: python3 scripts/security/test-backend-vulnerability-gate.py

      - name: Resolve Maven runtime inventory
        id: inventory
        working-directory: backend/nexora-api
        run: |
          mvn --batch-mode --no-transfer-progress dependency:tree -Dscope=runtime -DoutputType=json -DoutputFile=target/security/runtime-tree.json
          python3 ../../scripts/security/backend-vulnerability-gate.py inventory target/security/runtime-tree.json target/security/runtime.cdx.json

      - name: Scan resolved Maven runtime with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: sbom
          scan-ref: backend/nexora-api/target/security/runtime.cdx.json
          scanners: vuln
          format: json
          output: backend/nexora-api/target/security/trivy.json
          list-all-pkgs: true
          exit-code: '0'
          cache: false

      - name: Enforce scanner and vendor findings
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        run: |
          python3 scripts/security/backend-vulnerability-gate.py evaluate \
            backend/nexora-api/target/security/runtime.cdx.json \
            backend/nexora-api/target/security/trivy.json \
            scripts/security/backend-vendor-advisories.json \
            backend/nexora-api/target/security/gate.json

      - name: Upload runtime inventory and scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-runtime-security
          path: backend/nexora-api/target/security/
          if-no-files-found: error
          retention-days: 14
