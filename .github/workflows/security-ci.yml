name: Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-npm-audit:
    name: Frontend production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/nexora-web-next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/nexora-web-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies at high severity
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: frontend/nexora-web-next/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  backend-maven-dependency-resolution:
    name: Backend dependency tree visibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/nexora-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve backend dependency tree
        run: >-
          mvn -q -DskipTests dependency:tree
          -DoutputFile=maven-dependency-tree.txt

      - name: Upload Maven dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: backend-maven-dependency-tree
          path: backend/nexora-api/maven-dependency-tree.txt
          if-no-files-found: error
          retention-days: 14
