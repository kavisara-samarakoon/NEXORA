name: API Smoke CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Local API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify smoke script syntax and executable bit
        run: |
          test -x scripts/api-smoke-test.sh
          bash -n scripts/api-smoke-test.sh

      - name: Prepare Maven dependencies for smoke test
        working-directory: backend/nexora-api
        run: |
          max_attempts=4
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Preparing Maven dependencies... attempt ${attempt}/${max_attempts}"
            # Recheck artifacts left missing by an earlier transfer failure in this runner.
            if mvn --batch-mode --no-transfer-progress --update-snapshots -DskipTests dependency:go-offline; then
              echo "Maven dependencies are ready."
              break
            fi

            if (( attempt == max_attempts )); then
              echo "Maven dependency preparation failed after ${max_attempts} attempts."
              exit 1
            fi

            retry_delay=$((attempt * 10))
            echo "Maven attempt ${attempt}/${max_attempts} failed; retrying in ${retry_delay} seconds."
            sleep "${retry_delay}"
          done

      - name: Start backend for smoke test
        working-directory: backend/nexora-api
        run: |
          nohup mvn --batch-mode --no-transfer-progress -DskipTests spring-boot:run > ../../backend-smoke.log 2>&1 &
          echo "$!" > ../../backend-smoke.pid

      - name: Wait for backend health
        run: |
          if [[ ! -s backend-smoke.pid ]]; then
            echo "Backend PID file is missing or empty."
            tail -n 160 backend-smoke.log || true
            exit 1
          fi

          backend_pid="$(cat backend-smoke.pid)"
          if [[ ! "${backend_pid}" =~ ^[0-9]+$ ]]; then
            echo "Backend PID file does not contain a valid process ID."
            tail -n 160 backend-smoke.log || true
            exit 1
          fi

          backend_healthy=false
          for attempt in {1..60}; do
            if ! kill -0 "${backend_pid}" 2>/dev/null; then
              echo "Backend process exited before becoming healthy."
              tail -n 160 backend-smoke.log || true
              exit 1
            fi

            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              echo "Backend is healthy."
              backend_healthy=true
              break
            fi
            echo "Waiting for backend health... attempt ${attempt}/60"
            sleep 2
          done

          if [[ "${backend_healthy}" != "true" ]]; then
            echo "Backend did not become healthy."
            tail -n 160 backend-smoke.log || true
            exit 1
          fi

      - name: Run API smoke test
        env:
          NEXORA_API_BASE_URL: http://localhost:8080
          NEXORA_SMOKE_ORIGIN: http://localhost:3000
        run: scripts/api-smoke-test.sh

      - name: Stop backend
        if: always()
        run: |
          if [[ -f backend-smoke.pid ]]; then
            kill "$(cat backend-smoke.pid)" 2>/dev/null || true
          fi

      - name: Upload backend smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-smoke-log
          path: backend-smoke.log
          if-no-files-found: warn
          retention-days: 14
