        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        path:
          type: string
          description: Request URI path without query data.
        timestampUtc:
          type: string
          format: date-time
        retryAfterSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
